name: Build Windows installer

# Every push and pull request: type-check, the repo's own business-rule
# checks, and a production build — so a broken change is caught on GitHub,
# not on the server PC.
#
# Push to main (or "Run workflow" by hand from the Actions tab): also builds
# the Windows installer and attaches it to the run as the
# "Biome-Windows-Installer" artifact, ready to download and install.

# whatsapp-web.js depends on puppeteer, which would download its own
# Chromium (~150 MB) into the installer. The agent drives the Edge/Chrome
# already on the PC instead, so the download is skipped everywhere.
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, checks and build
    runs-on: ubuntu-latest
    env:
      # Electron itself is not needed to type-check or build the web app.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit -p .
      - name: Business-rule checks
        run: npm run check
      - name: Production build
        run: npx next build

  android:
    name: Android app (.apk)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build the APK
        working-directory: android-app
        # Signed with the debug key (see app/build.gradle.kts) so it installs
        # directly on a phone; replace with a real keystore for the Play Store.
        run: gradle assembleRelease --no-daemon
      - name: Collect
        run: |
          mkdir -p out
          cp "$(ls android-app/app/build/outputs/apk/release/*.apk | head -1)" out/biome-erp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Biome-Android-App
          path: out/biome-erp.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows installer (.exe)
    needs: [check, android]
    # An Android build problem must never stop the Windows installer.
    if: always() && needs.check.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Ship the Android app inside the installer: the "Android app" button in
      # the top bar then works on a fresh install without any upload.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Biome-Android-App
          path: public/downloads
      - name: Build the app
        run: npx next build
      - name: Package the installer
        # --publish never: build only, never upload a release anywhere.
        run: npx electron-builder --win --x64 --publish never
      # The WhatsApp agent, run from the PACKAGED app with the packaged
      # Biome.exe (Electron's own Node), on Windows with Edge — exactly as
      # on the server PC. Results appear as annotations on the run.
      - name: WhatsApp smoke test (packaged app)
        continue-on-error: true
        run: node tools/smoke/wa-smoke.js --exe release/win-unpacked/Biome.exe --app release/win-unpacked/resources/app --qr-wait 180000
      - uses: actions/upload-artifact@v4
        with:
          name: Biome-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
